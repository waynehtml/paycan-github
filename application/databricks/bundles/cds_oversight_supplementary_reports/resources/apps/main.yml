variables:
  # name: app_name
  # description: Full lowercase Databricks App name, 2-30 letters, digits, or hyphens.
  # required: true
  # value:
  #   modes: ["infer", "input"]
  #   infer: From confirmed project.domain and the user-provided app name using
  #     <domain>-<app name>, lowercasing and replacing whitespace with hyphens.
  #   input_example: "fmd-client-portal"
  app_name:
    default: "{{app_name}}"
  # name: app_description
  # description: Lowercase description of the Databricks App.
  # required: true
  # value:
  #   modes: ["infer", "input"]
  #   infer: From confirmed project.domain and the user-provided app name using
  #     <domain> <app name> app, lowercasing and replacing app-name hyphens
  #     and whitespace runs with single spaces.
  #   input_example: "fmd client portal app"
  app_description:
    default: "{{app_description}}"
  app_spn_tenantid_key:
    description: Secret key name for the MAIN app's SPN tenant ID.
  app_spn_id_key:
    description: Secret key name for the MAIN app's SPN client ID.
  app_spn_secret_key:
    description: Secret key name for the MAIN app's SPN client secret.

resources:
  apps:
    MAIN:
      name: ${var.app_name}
      source_code_path: ../../apps/main
      description: ${var.app_description}

      # Named secret bindings available to this app. Bundle variables select the
      # scope and secret key name for the target; they do not contain secret values.
      # The config.env entries below reference these resource names via value_from.
      resources:
        - name: spn-tenantid
          secret:
            scope: "${var.app_secrete_scope}"
            key: "${var.app_spn_tenantid_key}"
            permission: READ
        - name: spn-id
          secret:
            scope: "${var.app_secrete_scope}"
            key: "${var.app_spn_id_key}"
            permission: READ
        - name: spn-secret
          secret:
            scope: "${var.app_secrete_scope}"
            key: "${var.app_spn_secret_key}"
            permission: READ

      # Databricks injects config.env entries when the app starts; Python reads
      # them through os.environ. Choose value or value_from for each entry:
      # - value: a literal or bundle substitution; no app resource binding needed.
      # - value_from: the name of a resource in this app's resources list.
      # For secret bindings, value_from injects the secret value. Using
      # value: ${var.app_spn_tenantid_key} would inject only the secret key name.
      config:
        command: ["python", "-m", "streamlit", "run", "app.py"]
        env:
          - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
            value: "false"
          - name: SPN_TENANTID
            value_from: spn-tenantid
          - name: SPN_ID
            value_from: spn-id
          - name: SPN_SECRET
            value_from: spn-secret
          - name: AZURE_WORKSPACE_RESOURCE_ID
            value: "${var.internal_databricks_resource_id}"
          - name: DATABRICKS_WAREHOUSE_ID
            value: "${var.sql_warehouse_serverless_large_id}"
          - name: ENV_NAME
            value: "${bundle.target}"
          - name: UC_CATALOG_NAME
            value: "${var.catalog}"

